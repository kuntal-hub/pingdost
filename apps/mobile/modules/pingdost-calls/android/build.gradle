// Calls on Android (Phase 26, ADR 0029): the incoming-call notification with a full-screen
// intent, the `phoneCall` foreground service, audio routing and the proximity screen-off, on
// Android's own APIs (no library). Local module: autolinked from apps/mobile/modules.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.pingdost.calls'
version = '0.1.0'

android {
  namespace "com.pingdost.calls"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Camera effects and screen sharing (ADR 0037, 0038) plug into react-native-webrtc and its
  // WebRTC build (`org.jitsi:webrtc`, an `api` dependency there); the app ships both already.
  compileOnly project(':react-native-webrtc')
}