# coturn on the staging VPS (ADR 0013, ADR 0028): STUN plus TURN relays for 1:1 calls.
# deploy/compose.staging.yml runs it with host networking and passes the secret, the realm and
# the public IP as flags (from /srv/pingdost/.env), so this file holds no secret.
#
# Ports to open in Hostinger's panel firewall (and in ufw, if you turned it on: host networking
# is not behind Docker's NAT, so ufw applies to coturn): 3478/udp, 3478/tcp, 5349/tcp (only with
# TLS below), 49160-49400/udp.

listening-port=3478
# The relay range: 240 ports, a few dozen calls at once on KVM 1.
min-port=49160
max-port=49400

# Short-lived credentials only (TURN REST API): username "<expiry>:<user ID>",
# password base64(HMAC-SHA1(static-auth-secret, username)). No static users; the admin CLI is
# off (coturn 4.18 enables it only with --cli).
use-auth-secret
fingerprint
stale-nonce=600

# Never relay into the VPS, Docker's networks, link-local metadata services or other
# private/reserved ranges (SSRF). Peers are public addresses only.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse limits: allocations per user and in total, and a per-session bandwidth cap
# (about 3 Mbit/s, ample for 720p video; the VPS has 4 TB of transfer a month).
user-quota=12
total-quota=600
max-bps=400000

# TLS on 5349 (optional, docs/ops/vps-setup.md "TURN over TLS"): once the certificate copy is
# in place, uncomment these and delete no-tls. Until then TURN_URLS has no turns:.
#cert=/etc/coturn/tls/turn.crt
#pkey=/etc/coturn/tls/turn.key
#tls-listening-port=5349
#no-tlsv1
#no-tlsv1_1
no-tls

# Logging: one line per session start and end (client address and TURN username, i.e. the
# user ID) to stdout, rotated by Docker with the rest (about a week). No peer or packet logs.
log-file=stdout
simple-log
no-software-attribute
