# Local development infrastructure (ARCHITECTURE A1). Start with `pnpm infra:up`.
# Profiles: `s3` (SeaweedFS as a local S3, Phase 14: `docker compose --profile s3 up -d --wait`)
# and later `calls` (coturn, Phase 25).
name: pingdost

services:
  mongo:
    image: mongo:8.0.34
    # Single-node replica set: needed for majority writes and transactions.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      # Initiates the replica set on first run; healthy once this node is primary.
      # The member host is localhost:27017 so clients on the host (and CI) can connect.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
      start_interval: 1s

  valkey:
    image: valkey/valkey:8.1.10-alpine
    # The mailbox answers Accepted once Redis holds an envelope, so Redis must persist it:
    # append-only file, fsync every second, and never evict a staged envelope (ADR 0010, 0013).
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 1s

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI: http://localhost:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 1s

  # An S3-compatible store for the `s3` attachment adapter (ADR 0017). MinIO's community
  # images are no longer published, so the local stand-in for R2 is SeaweedFS (Apache-2.0).
  # Dev-only credentials; the bucket is created by the tests or `aws s3 mb`.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: ['s3']
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.port=8333',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-master.volumeSizeLimitMB=1024',
      ]
    ports:
      - '8333:8333'
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
      start_interval: 1s

configs:
  seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "pingdost-dev",
            "credentials": [{ "accessKey": "pingdost-dev", "secretKey": "pingdost-dev-secret" }],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  mongo-data:
  mongo-config:
  valkey-data:
  seaweedfs-data:
