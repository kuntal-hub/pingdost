[package]
name = "pingdost-crypto"
version = "0.1.0"
description = "Narrow uniffi wrapper over vodozemac (Olm / Megolm) for PingDost clients"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pingdost_crypto"
crate-type = ["lib", "cdylib"]

[dependencies]
# uniffi must stay on 0.31.x to match uniffi-bindgen-react-native 0.31 (it pins `=0.31`).
uniffi = "=0.31.2"
vodozemac = "=0.11.1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Randomness from Web Crypto (crypto.getRandomValues) in browsers and Node.
vodozemac = { version = "=0.11.1", features = ["wasm_js"] }
uniffi-runtime-wasm = "=0.31.0-6"
uniffi_core = { version = "=0.31.2", features = ["wasm-unstable-single-threaded"] }
