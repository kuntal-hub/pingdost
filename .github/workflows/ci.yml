name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # @pingdost/protocol's lint also runs `buf lint`.
      - run: pnpm turbo run lint typecheck test

  protocol:
    name: Protocol schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code is committed and up to date
        run: |
          pnpm --filter @pingdost/protocol gen
          git status --porcelain -- packages/protocol/src/gen
          test -z "$(git status --porcelain -- packages/protocol/src/gen)"
      - name: No breaking wire changes against main
        if: github.event_name == 'pull_request'
        working-directory: packages/protocol
        run: >-
          pnpm exec buf breaking
          --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=packages/protocol"

  rust:
    name: Rust crypto crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --workspace --target aarch64-linux-android -- -D warnings
      - run: cargo test --workspace

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # GitHub service containers cannot pass --replSet to mongod, so start Mongo (replica set)
      # and Valkey from docker-compose.yml and wait until their healthchecks pass.
      - run: docker compose up -d --wait mongo valkey
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:int
        env:
          MONGODB_URI: mongodb://localhost:27017/pingdost?replicaSet=rs0
          REDIS_URL: redis://localhost:6379
      - if: failure()
        run: docker compose logs --tail=200
