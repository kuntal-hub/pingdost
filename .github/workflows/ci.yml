name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # @pingdost/protocol's lint also runs `buf lint`.
      - run: pnpm turbo run lint typecheck test

  protocol:
    name: Protocol schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code is committed and up to date
        run: |
          pnpm --filter @pingdost/protocol gen
          git status --porcelain -- packages/protocol/src/gen
          test -z "$(git status --porcelain -- packages/protocol/src/gen)"
      - name: No breaking wire changes against main
        if: github.event_name == 'pull_request'
        working-directory: packages/protocol
        run: >-
          pnpm exec buf breaking
          --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=packages/protocol"

  rust:
    name: Rust crypto crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --workspace --target aarch64-linux-android -- -D warnings
      # iOS (Phase 28): compile checks only; the xcframework builds on macOS (ios.yml).
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - run: cargo clippy --workspace --target aarch64-apple-ios -- -D warnings
      - run: cargo clippy --workspace --target aarch64-apple-ios-sim -- -D warnings
      - run: cargo test --workspace
      # RustSec advisories, licenses, bans and sources (deny.toml; Phase 27).
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  swift-nearby:
    # Phase 30 (ADR 0033): the iOS nearby core (framing, links, policy) speaks Android's bytes;
    # it has no Apple imports, so it is tested on Linux. The CoreBluetooth half builds in ios.yml.
    name: iOS nearby core (Swift, Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v7
      - run: swift test
        working-directory: apps/mobile/modules/nearby/ios

  security:
    name: Secrets, advisories, licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: Secret scan (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Accepted advisories are listed by GHSA in pnpm-workspace.yaml (auditConfig).
      - run: pnpm audit
      - run: pnpm licenses:check

  bindings:
    name: Crypto bindings are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Regenerate the wasm2 binding (web, Node)
        run: pnpm --filter @pingdost/crypto build:wasm
      - name: Regenerate the jsi2 binding (Android)
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm --filter @pingdost/crypto-native build:android
      # The .wasm differs by path separators between hosts, so only the TypeScript is compared;
      # the module must not carry a build machine's paths (scripts/remap-rust-paths.mjs).
      - name: Generated TypeScript matches the commit
        run: |
          git status --porcelain -- packages/crypto/src/generated packages/crypto-native/src/generated
          git diff --exit-code -- 'packages/crypto/src/generated/*.ts' 'packages/crypto-native/src/generated/*.ts'
      - name: The committed WASM carries no build-machine paths
        run: |
          git checkout -- packages/crypto/src/generated/pingdost_crypto.wasm
          ! grep -a -E -q '(/home/|/Users/|[A-Za-z]:\\Users\\)' packages/crypto/src/generated/pingdost_crypto.wasm

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # GitHub service containers cannot pass --replSet to mongod, so start Mongo (replica set),
      # Valkey and Mailpit (OTP emails) from docker-compose.yml and wait for their healthchecks.
      - run: docker compose up -d --wait mongo valkey mailpit
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:int
        env:
          MONGODB_URI: mongodb://localhost:27017/pingdost?replicaSet=rs0
          REDIS_URL: redis://localhost:6379
          MAILPIT_URL: http://localhost:8025
      - if: failure()
        run: docker compose logs --tail=200
