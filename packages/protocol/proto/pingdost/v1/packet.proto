// PingDost wire protocol v1: the transport layer (ARCHITECTURE A4, REQ §4.3, §11.4).
//
// A TransportPacket is what the server, mesh relays and nearby peers see. The same packet
// travels over the WebSocket, Bluetooth or a mesh relay, so the message engine does not
// depend on the transport.
//
// Compatibility: within v1, add fields and enum values only. Never renumber, retype or
// reuse a field number; reserve removed ones.
syntax = "proto3";

package pingdost.v1;

// What a TransportPacket's payload holds.
enum PacketKind {
  PACKET_KIND_UNSPECIFIED = 0;
  // payload: Envelope, an E2EE message for one recipient device.
  PACKET_KIND_ENVELOPE = 1;
  // payload: Ack. The recipient device has stored the listed envelopes.
  PACKET_KIND_ACK = 2;
  // payload: MeshAck. A mesh relay accepted a packet; this is not recipient delivery.
  PACKET_KIND_MESH_ACK = 3;
  // payload: MeshChunk, one encrypted chunk of an attachment sent over the mesh.
  PACKET_KIND_MESH_CHUNK = 4;
  // payload: Envelope that is relayed only to an online recipient and never stored
  // (call signaling, history-sync chunks).
  PACKET_KIND_EPHEMERAL = 5;
  // payload: Hello, the nearby peer handshake.
  PACKET_KIND_HELLO = 6;
}

// Bit values for TransportPacket.flags. Receivers ignore bits they do not know.
enum PacketFlag {
  PACKET_FLAG_UNSPECIFIED = 0;
  // Time-critical (an incoming call): the server may send a call-priority push wake.
  PACKET_FLAG_URGENT = 1;
}

message TransportPacket {
  // Protocol major version (1). Decoders reject other major versions.
  uint32 version = 1;
  // UUIDv7, 16 bytes. Unique per packet; relays and the server dedupe on it.
  bytes packet_id = 2;
  PacketKind kind = 3;
  // Destination: a recipient device ID (16 bytes) or a mesh routing token.
  bytes dst = 4;
  // Epoch milliseconds.
  int64 created_at_ms = 5;
  // Absolute expiry in epoch milliseconds. Relays and the server never extend it.
  int64 expires_at_ms = 6;
  // Mesh hops left. Each forwarding relay decrements it; 0 means deliver directly only.
  uint32 hop_budget = 7;
  // PacketFlag bits.
  uint32 flags = 8;
  // The encoded message named by `kind`.
  bytes payload = 9;
}

// The recipient device has stored these envelopes, so the mailbox may delete them
// (ARCHITECTURE A3). Not a delivery receipt: those are E2EE Content (Receipt).
message Ack {
  // Envelope IDs, 16 bytes each.
  repeated bytes envelope_ids = 1;
}
