// PingDost wire protocol v1: nearby and mesh relay messages (REQ §11.3, §11.4).
//
// Phase 22 defined the nearby handshake (ADR 0024) and Phase 23 the relay (ADR 0025). A
// relayed packet is a TransportPacket of kind MESH_ENVELOPE: its own fields are the mesh
// header (packet ID, creation time, absolute expiry, the recipient's routing token as `dst`,
// hop budget, spray copies) and its payload a MeshEnvelope. Extend by adding fields only.
syntax = "proto3";

package pingdost.v1;

import "pingdost/v1/envelope.proto";

// Unused: the relay header is the TransportPacket's own fields (ADR 0025). Kept so that its
// field numbers are never reused.
message MeshHeader {
  // UUIDv7, 16 bytes; the seen-packet cache key.
  bytes packet_id = 1;
  int64 created_at_ms = 2;
  int64 expires_at_ms = 3;
  bytes dst_routing_token = 4;
  uint32 hop_budget = 5;
  bytes origin_token = 6;
  // Set for chunks of a file transfer.
  MeshChunkRef chunk_ref = 7;
}

// Identifies one chunk of an attachment (ADR 0004 chunk index and hash list).
message MeshChunkRef {
  // The AttachmentManifest.attachment_id.
  bytes transfer_id = 1;
  uint32 index = 2;
  uint32 count = 3;
  // SHA-256 of this chunk's ciphertext, checkable against the hash list without the key.
  bytes chunk_sha256 = 4;
}

// Payload of PACKET_KIND_MESH_CHUNK.
message MeshChunk {
  MeshChunkRef ref = 1;
  // One ciphertext chunk.
  bytes data = 2;
}

// Payload of PACKET_KIND_MESH_ACK, hop-local: what the next holder did with one mesh packet.
// ACCEPTED from a relay is `relayed` (REQ §8.3), never delivery.
message MeshAck {
  bytes packet_id = 1;
  MeshAckStatus status = 2;
  // Ed25519 by the answering device's identity key (the one it proved in its Hello) over
  // meshAckMessage(the other side's link token, packet ID, status), 64 bytes.
  bytes signature = 3;
}

enum MeshAckStatus {
  MESH_ACK_STATUS_UNSPECIFIED = 0;
  // A relay stored it and will carry it on.
  MESH_ACK_STATUS_ACCEPTED = 1;
  // The recipient device stored it: relays drop their copies.
  MESH_ACK_STATUS_DELIVERED = 2;
  // Already seen here: nothing changed.
  MESH_ACK_STATUS_DUPLICATE = 3;
  // Not taken (relaying off or paused, full, over a quota or rate, expired, out of hops, or
  // failed the recipient's check).
  MESH_ACK_STATUS_REFUSED = 4;
}

// Payload of PACKET_KIND_MESH_ENVELOPE. The Envelope's fields without its two device IDs: the
// recipient is the packet's `dst` token, and the sender is `origin_token`, which only devices
// holding the sender's directory can resolve (ADR 0025).
message MeshEnvelope {
  // routingToken(sender device ID, UTC day of created_at_ms), 16 bytes.
  bytes origin_token = 1;
  // The Envelope's ID: the recipient dedupes on it across the Internet and mesh paths.
  bytes envelope_id = 2;
  CryptoType crypto_type = 3;
  optional bytes group_id = 4;
  string megolm_session_id = 5;
  bytes ciphertext = 6;
  // Ed25519 by the sender device's identity key over meshEnvelopeMessage(packet ID, created,
  // expires, dst, this message's other fields), 64 bytes. Only the recipient can check it.
  bytes signature = 7;
}

// Payload of PACKET_KIND_MESH_SUMMARY, hop-local, sent once each side's Hello is proved.
message MeshSummary {
  // This device's routing tokens for every day a live packet to it can have been made on.
  repeated bytes routing_tokens = 1;
  // Packet IDs this device knows were delivered: holders drop their copies.
  repeated bytes delivered = 2;
}

// Payload of PACKET_KIND_HELLO: the nearby peer handshake (ADR 0024). Each side sends two:
// first without `proof` (its fresh token), then, once it has the other side's token, the
// same token with `proof`. A proof is bound to both tokens, so it cannot be replayed on
// another link.
message Hello {
  // The highest protocol major version this peer speaks.
  uint32 protocol_version = 1;
  // 16 random bytes, new for every link: the challenge the other side signs.
  bytes peer_token = 2;
  // HelloCapability bits.
  uint32 capabilities = 3;
  // Set in the second Hello.
  HelloProof proof = 4;
}

// Bit values for Hello.capabilities. Receivers ignore bits they do not know.
enum HelloCapability {
  HELLO_CAPABILITY_UNSPECIFIED = 0;
  // Takes envelopes addressed to its own device (direct nearby messaging, Phase 22).
  HELLO_CAPABILITY_DIRECT = 1;
  // Stores and forwards packets for other devices (mesh relay, Phase 23).
  HELLO_CAPABILITY_RELAY = 2;
}

// The sender holds a device identity key. It names the key, not the device or the account:
// only a peer that already has this key in its verified directory learns who it is.
message HelloProof {
  // The device's Ed25519 identity key, 32 bytes.
  bytes identity_key = 1;
  // Ed25519 over nearbyHelloMessage(own token, other side's token, identity key,
  // capabilities), 64 bytes.
  bytes signature = 2;
}
