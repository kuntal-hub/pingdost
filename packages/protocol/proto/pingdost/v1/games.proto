// PingDost wire protocol v1: games played inside chats (ADR 0049, Phase 42).
//
// A `Game` travels only inside E2EE Content (`Content.game`), as a control item to every
// member's devices, like a reaction. The server never sees it. Every client checks each event
// against the shared rules in `@pingdost/games` and folds the log into the same state.
syntax = "proto3";

package pingdost.v1;

message Game {
  // The game: the `create` event's message ID (16 bytes).
  bytes game_id = 1;
  // Turn events (`roll`, `move`, `skip`): the turn they belong to (0-based), and the roll
  // within that turn (0-based; a 6, a capture or a piece reaching home gives another roll).
  // The other games count every move, roll and skip as a turn of its own (`index` 0).
  // `leave`: the turns the leaver had seen. Others: 0.
  uint32 turn = 2;
  uint32 index = 3;

  oneof event {
    GameCreate create = 4;
    GameJoin join = 5;
    GameStart start = 6;
    GameRoll roll = 7;
    GameMove move = 8;
    GameSkip skip = 9;
    GameLeave leave = 10;
    GameEnd end = 11;
    GameEmote emote = 12;
    // Phase 45 (ADR 0052): sent to one seat's device only, over Olm; never in the shared log.
    GameDeal deal = 13;
  }
}

enum GameType {
  GAME_TYPE_UNSPECIFIED = 0;
  GAME_TYPE_LUDO = 1;
  // Phase 43: the quick games.
  GAME_TYPE_TIC_TAC_TOE = 2;
  GAME_TYPE_CONNECT_FOUR = 3;
  GAME_TYPE_DOTS_AND_BOXES = 4;
  GAME_TYPE_SNAKES_AND_LADDERS = 5;
  // Phase 44.
  GAME_TYPE_CHESS = 6;
  // Phase 45: a shedding card game (match color or number).
  GAME_TYPE_LAST_CARD = 7;
}

// Opens a game in the chat; it shows as an invitation card. The creator (host) takes the
// first seat at once.
message GameCreate {
  GameType type = 1;
  // The table's size (Ludo, Dots and Boxes, Snakes and Ladders: 2 to 4; the others 2). The
  // game starts by itself when this many have joined.
  uint32 max_players = 2;
  oneof settings {
    LudoSettings ludo = 3;
    TicTacToeSettings tic_tac_toe = 6;
    ConnectFourSettings connect_four = 7;
    DotsSettings dots = 8;
    SnakesSettings snakes = 9;
    ChessSettings chess = 10;
    LastCardSettings last_card = 12;
  }
  // The host's seat: see `GameJoin`.
  bytes anchor = 4;
  bytes salt = 5;
  bytes seat_data = 11;
}

// Defaults are the classic rules, so an empty message is Ludo King-style classic.
message LudoSettings {
  // Any roll brings a piece out of the yard (classic: only a 6).
  bool any_roll_starts = 1;
  // Two pieces of one color on a plain square block the others.
  bool blockades = 2;
  // The game ends when the first player has every piece home.
  bool stop_at_first_winner = 3;
}

// Classic 3 by 3; no options yet. Who plays first comes from the seats' salts; they play X.
message TicTacToeSettings {}

// Classic 7 columns by 6 rows; no options yet. Who drops first comes from the seats' salts.
message ConnectFourSettings {}

message DotsSettings {
  // Boxes per side, 3 to 6 (0: 4).
  uint32 size = 1;
}

// Defaults are the classic rules: one roll a turn, and an exact roll to reach 100 (a roll
// past it does not move).
message SnakesSettings {
  // A 6 gives another roll.
  bool six_rolls_again = 1;
  // A roll past 100 bounces back by the squares left over.
  bool bounce_back = 2;
}

message ChessSettings {
  // The host's side: 0 drawn from the seats' salts, 1 White, 2 Black. White moves first.
  uint32 host_side = 1;
}

// Takes a seat. `anchor` ends the seat's hash chain of roll secrets (32 bytes): every secret
// is fixed before anyone else's randomness exists. `salt` (16 bytes) feeds other players' rolls.
message GameJoin {
  bytes anchor = 1;
  bytes salt = 2;
  // Hidden-hand games (ADR 0052): what the seat commits to when it sits down (Last Card: 128
  // draw commitments of 16 bytes). Empty for the other games.
  bytes seat_data = 3;
}

// The host starts the game: these seats, in turn order. Self-contained, so a client that
// missed a join can still check every roll.
message GameStart {
  repeated GameSeat seats = 1;
  // A fresh salt from the host, made after every join (ADR 0052: opening hands).
  bytes salt = 2;
}

message GameSeat {
  bytes user_id = 1;
  bytes device_id = 2;
  // Ludo: 0 red, 1 green, 2 yellow, 3 blue. The other games: the seat's place at the table
  // (0, 1, …; the host's order), which also picks its color.
  uint32 color = 3;
  bytes anchor = 4;
  bytes salt = 5;
  bytes seat_data = 6;
}

// A roll by the seat whose turn it is. `reveal` is the next secret of its chain (32 bytes);
// the die comes from it and the salt of the latest event by another device. `salt` is new.
message GameRoll {
  bytes reveal = 1;
  bytes salt = 2;
  // Games where the roll moves by itself (Snakes and Ladders): 8 bytes of the state after
  // it, to catch a desync. Empty in Ludo (the move that follows carries it).
  bytes state_hash = 3;
}

// A move. Ludo: the piece moved after a roll (`token`). The other games: `play`. Sent by the
// seat, or, once its time is up, by another player as the move the rules choose for it (ADR
// 0049 amendment). `state_hash` is 8 bytes of the state after the move, to catch a desync.
message GameMove {
  uint32 token = 1;
  bytes salt = 2;
  bytes state_hash = 3;
  oneof play {
    TicTacToeMove tic_tac_toe = 4;
    ConnectFourMove connect_four = 5;
    DotsMove dots = 6;
    ChessMove chess = 7;
    LastCardMove last_card = 8;
  }
}

message TicTacToeMove {
  // 0 to 8, row by row from the top left.
  uint32 cell = 1;
}

message ConnectFourMove {
  // 0 to 6, from the left.
  uint32 column = 1;
}

message DotsMove {
  // The line drawn: the rows of horizontal lines first (size + 1 rows of `size`, top to
  // bottom, left to right), then the vertical ones (size rows of size + 1).
  uint32 line = 1;
}

// Squares are 0 to 63: a1 = 0, h1 = 7, a8 = 56. Chess has no timers, so no proxy moves.
message ChessMove {
  uint32 from = 1;
  uint32 to = 2;
  // A pawn reaching the last rank: 2 knight, 3 bishop, 4 rook, 5 queen (0 otherwise).
  uint32 promotion = 3;
  // The mover offers a draw along with this move.
  bool offer_draw = 4;
  // Instead of a move: take the draw the other player offered with their last move.
  bool accept_draw = 5;
}

// Another player skips a turn whose roll never came (the roller's app was closed).
message GameSkip {
  bytes salt = 1;
  bytes state_hash = 2;
}

// The sender leaves; it takes effect at their next turn.
message GameLeave {}

// The host ends the game for everyone (or cancels it before the start).
message GameEnd {}

// A quick reaction shown over the board for a moment. One emoji.
message GameEmote {
  string emoji = 1;
}

// Private (ADR 0052): cards dealt to one seat for a round, as the game encodes them.
message GameDeal {
  uint32 round = 1;
  bytes data = 2;
}

// No options yet: one round, first to empty their hand wins.
message LastCardSettings {}

// Play a card, draw one, or keep the drawn card and pass.
message LastCardMove {
  // The card played: the player's draw number for it, its code (1 to 54: colors 0 to 3 times
  // 0-9, skip, reverse, draw two; then wild, wild draw four) and the secret behind it.
  uint32 draw_index = 1;
  uint32 card = 2;
  bytes secret = 3;
  // A wild's new color, 1 to 4 (0: none).
  uint32 color = 4;
  // Called "last card" with the second-to-last card (otherwise two cards as a penalty).
  bool last_card_call = 5;
  // Instead of a card: draw one; `pass` keeps the drawn card and ends the turn (both: an
  // absent player's turn played for them).
  bool draw = 6;
  bool pass = 7;
}
