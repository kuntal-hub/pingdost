// PingDost wire protocol v1: message content (ARCHITECTURE A4, REQ §8).
//
// Content travels only inside E2EE ciphertext (Envelope.ciphertext): the server and relays
// never see it. Bodies for later phases are minimal; those phases extend them by adding
// fields only.
syntax = "proto3";

package pingdost.v1;

message ContentHeader {
  // Content major version (1). Decoders reject other major versions.
  uint32 version = 1;
  // UUIDv7, 16 bytes. Clients dedupe on it.
  bytes message_id = 2;
  // The conversation: a group ID, or the 1:1 conversation ID.
  bytes conversation_id = 3;
  // The sending user (16 bytes). Receivers check it owns the sending device.
  bytes sender_user_id = 4;
  // Sender clock, epoch milliseconds.
  int64 sent_at_ms = 5;
  // The message this one replies to (16 bytes).
  optional bytes reply_to = 6;
  // Direct conversations: the other user (16 bytes). The sender's own other devices need it
  // to file their copy, and every receiver checks that
  // conversation_id = directConversationIdFor(sender_user_id, recipient_user_id).
  optional bytes recipient_user_id = 7;
}

message Content {
  ContentHeader header = 1;

  oneof body {
    Text text = 2;
    Reaction reaction = 3;
    Edit edit = 4;
    Delete delete = 5;
    Receipt receipt = 6;
    AttachmentManifest attachment_manifest = 7;
    GroupControl group_control = 8;
    RoomKey room_key = 9;
    SyncChunk sync_chunk = 10;
    CallSignal call_signal = 11;
    SessionReset session_reset = 12;
    KeyChange key_change = 13;
    RoomKeyRequest room_key_request = 14;
  }

  // Zero bytes that pad the encoded Content to a size bucket (codec padding policy).
  // Field 15 keeps its tag at one byte, which the padding arithmetic relies on.
  bytes padding = 15;
}

message Text {
  string body = 1;
}

message Reaction {
  bytes target_message_id = 1;
  // One emoji. With `remove`, the sender withdraws that reaction.
  string emoji = 2;
  bool remove = 3;
}

message Edit {
  bytes target_message_id = 1;
  // The replacement text.
  string body = 2;
}

// Delete for everyone.
message Delete {
  bytes target_message_id = 1;
}

// An E2EE receipt from the recipient device. Only DELIVERED from the recipient device
// moves a message to `delivered_to_recipient_device` (REQ §8.3).
message Receipt {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_DELIVERED = 1;
    TYPE_READ = 2;
  }

  Type type = 1;
  // Message IDs, 16 bytes each.
  repeated bytes message_ids = 2;
  // Mesh hops the messages travelled, when they arrived over the mesh.
  optional uint32 hop_count = 3;
}

// How to fetch and decrypt one attachment (ADR 0004). Phase 14 implements it.
message AttachmentManifest {
  // UUIDv7, 16 bytes: the staged upload, and the transfer ID on the mesh.
  bytes attachment_id = 1;
  // "xchacha20poly1305-stream-be32-64k/1".
  string scheme = 2;
  // 32-byte file key.
  bytes key = 3;
  // 19-byte STREAM nonce prefix.
  bytes nonce_prefix = 4;
  uint64 plaintext_size = 5;
  uint32 chunk_size = 6;
  uint32 chunk_count = 7;
  string mime_type = 8;
  optional string file_name = 9;
  // SHA-256 over all ciphertext chunks.
  bytes ciphertext_sha256 = 10;
  // SHA-256 of the list of per-chunk ciphertext SHA-256 hashes.
  bytes chunk_hash_list_sha256 = 11;
  // A small preview (image or video frame), encrypted and staged as its own attachment with
  // its own key (ADR 0004). Made on the sender's device, never by a server.
  AttachmentManifest thumbnail = 12;
  // Text shown with the attachment.
  string caption = 13;
}

// Group membership and info changes, E2EE so the server stores no group name or avatar.
// Sent over Olm by an admin (LEAVE: by the leaving member) after the server accepted the
// change; clients apply it only if the sender may make it (ADR 0016).
message GroupControl {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_CREATE = 1;
    ACTION_ADD_MEMBERS = 2;
    ACTION_REMOVE_MEMBERS = 3;
    ACTION_LEAVE = 4;
    ACTION_UPDATE_INFO = 5;
    ACTION_CHANGE_ROLE = 6;
    // The whole current state, for members who were just added.
    ACTION_SNAPSHOT = 7;
  }

  bytes group_id = 1;
  Action action = 2;
  // User IDs, 16 bytes each: the members added, removed or whose role changed (all members
  // on CREATE).
  repeated bytes member_user_ids = 3;
  // Name, description and avatar count only on CREATE, SNAPSHOT and UPDATE_INFO.
  string name = 4;
  // The server's membership version after the change.
  uint64 version = 5;
  // Every member and role after the change.
  repeated GroupMember members = 6;
  string description = 7;
  // A small image (JPEG/PNG/WebP, at most 32 KiB); empty for none.
  bytes avatar = 8;
}

message GroupMember {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_OWNER = 1;
    ROLE_ADMIN = 2;
    ROLE_MEMBER = 3;
  }

  // 16 bytes.
  bytes user_id = 1;
  Role role = 2;
}

// A Megolm room key, sent to each member device over Olm (ARCHITECTURE A5).
message RoomKey {
  bytes group_id = 1;
  // Megolm session ID (base64).
  string session_id = 2;
  // Signed Megolm session key (base64). Secret.
  string session_key = 3;
  // `session_key` is an exported key (from a given index, unsigned), sent in answer to a
  // RoomKeyRequest by the session's own sender device.
  bool exported = 4;
}

// A member device asks the sender device of a Megolm session for its key, e.g. after its
// RoomKey was lost to a broken Olm session. Answered only for devices the session was
// shared with.
message RoomKeyRequest {
  bytes group_id = 1;
  string session_id = 2;
  // The first message index needed.
  uint32 from_index = 3;
}

// One chunk of a history sync from the phone to a linked web device. Phase 18 extends it.
message SyncChunk {
  // UUIDv7, 16 bytes, shared by every chunk of one sync.
  bytes sync_id = 1;
  uint32 sequence = 2;
  bool last = 3;
  bytes data = 4;
}

// WebRTC call signaling, relayed as an ephemeral packet. Phase 25 extends it.
message CallSignal {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_OFFER = 1;
    TYPE_ANSWER = 2;
    TYPE_ICE_CANDIDATE = 3;
    TYPE_HANGUP = 4;
    TYPE_REJECT = 5;
    TYPE_BUSY = 6;
  }

  // UUIDv7, 16 bytes.
  bytes call_id = 1;
  Type type = 2;
  bool video = 3;
  // SDP for OFFER and ANSWER.
  string sdp = 4;
  // An ICE candidate as JSON (RTCIceCandidateInit) for ICE_CANDIDATE.
  string ice_candidate = 5;
}

// Asks the peer device to start a new Olm session, e.g. after an undecryptable message.
message SessionReset {
  // The broken Olm session's ID, if known.
  string session_id = 1;
}

// The sender's device list or keys changed: refetch them from the key directory.
message KeyChange {
  uint32 key_version = 1;
}
